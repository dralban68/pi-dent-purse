name: publish

# On every push to main: check, then publish to npm. If package.json's version is already on
# npm, the patch version is bumped first, and after a successful publish the bump is committed
# back to main, so main always names the latest release. The GITHUB_TOKEN push does not
# trigger workflows, so this does not loop.
# Auth: npm trusted publishing (OIDC) once configured on npmjs.com, else the NPM_TOKEN secret
# (a granular token with "bypass two-factor authentication").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump the patch version unless it is on npm
        id: bump
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version --prefer-online 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; bumping the patch version"
            npm version patch --no-git-tag-version
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Publish unless this version is on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "$name@$version" version --prefer-online 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; bump the version to publish"
            exit 0
          fi
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          # A version staged or published since the check above (a concurrent run, an approved
          # staged publish) is not a failure of this run.
          if out=$(npm publish "$tarball" --access public 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          if grep -q 'previously staged version' <<<"$out"; then
            echo "::warning::$name@$version is staged on npm and waits for approval: npm stage list $name"
            exit 0
          fi
          if grep -q 'cannot publish over the previously published versions' <<<"$out"; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          exit 1
      - name: Commit the version bump back to main
        if: steps.bump.outputs.bumped == 'true'
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: $name@$version"
          git pull --rebase origin main
          if ! git push origin main; then
            echo "::warning::published $name@$version, but the version bump could not be pushed to main; the next push bumps again"
          fi
